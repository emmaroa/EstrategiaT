<!DOCTYPE html>
<html lang="es">
<head><base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>EstrategiaT | Administración Integral de Talleres</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/design-system.css?v=20260819-6">
  <link rel="stylesheet" href="css/mobile-app.css">
  <link rel="stylesheet" href="css/reference-theme.css?v=20260927-1" media="screen">
</head>
<body class="login-body">

  <div class="login-container">

    <div class="left-panel">
      <div class="brand-box">
        <div class="logo">E</div>

        <h1>EstrategiaT</h1>

        <p>
          Administración integral de talleres, flotillas, almacén y compras.
        </p>

        <div class="tags">
          <span>Parque vehicular</span>
          <span>Almacén y compras</span>
          <span>Seguimiento SIIF</span>
          <span>Portal de proveedores</span>
          <span>Indicadores ejecutivos</span>
        </div>
      </div>
    </div>

    <div class="right-panel">

      <div class="login-card">
        <h2>Bienvenido</h2>
        <p>Inicia sesión para acceder al sistema.</p>

        <div class="input-group">
          <label for="usuario">Usuario o correo</label>
          <input type="text" id="usuario" placeholder="Ingresa tu usuario o correo" autocomplete="username" aria-label="Usuario o correo">
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" aria-label="Contraseña">
        </div>

        <button class="btn" id="btnLogin" type="button">Ingresar</button>

        <p id="mensajeError" class="error" role="alert" aria-live="assertive"></p>

        <div class="extra">
          <span>v2.0.0</span>
          <span class="status">● Sistema operativo</span>
        </div>
      </div>

    </div>

  </div>


  
  
  
  
</body>
</html>
