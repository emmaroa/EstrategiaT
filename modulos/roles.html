</head><body class="dashboard-body"><aside class="sidebar"><div class="sidebar-logo"><h3>EstrategiaT</h3></div><nav id="etNav"></nav><button id="etLogout" class="logout">Cerrar sesión</button></aside>
<main class="main-content"><header class="topbar"><div><h1>Roles y permisos</h1><p>Define los módulos y acciones de cada rol. Cada usuario conserva su lista de módulos permitidos.</p></div><button id="nuevoRol" class="btn-small" type="button">Crear rol</button></header>
<p id="estadoRoles" role="status" aria-live="polite"></p>
<section class="panel"><label for="rolEditar">Rol</label><select id="rolEditar"><option value="">Selecciona un rol</option></select><button type="button" id="recargarRoles" class="btn-secondary">Actualizar</button></section>
<section class="panel" id="editorRol" hidden><form id="formRol">
<div class="form-grid"><label>Nombre del rol<input id="nombreRol" required minlength="2" maxlength="80" placeholder="Ej. Supervisor de compras"></label><input type="hidden" id="claveRol"></div>
<p id="usuariosRol"></p><label>Buscar módulo<input type="search" id="buscarModuloRol"></label>
<div id="modulosRol"></div><p>Usuarios, Roles y Licencias están reservados a SuperAdmin. Eliminar registros y aprobar cancelaciones conservan sus restricciones.</p>
<div class="profile-actions"><button class="btn-small" type="submit" id="guardarRol">Guardar rol</button><button class="btn-secondary" type="button" id="eliminarRol">Eliminar rol</button></div>
</form></section></main><script src="../js/modules/roles.js?v=2.0.168"></script></body></html>
